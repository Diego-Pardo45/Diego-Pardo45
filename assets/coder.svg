<svg xmlns="http://www.w3.org/2000/svg" width="384" height="256" viewBox="0 0 96 64" shape-rendering="crispEdges">
  <title>Personaje pixel art programando con una taza de café</title>
  <style>
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.2); } }

    .tap-a { animation: tap 0.36s steps(1) infinite; }
    .tap-b { animation: tap 0.36s steps(1) infinite; animation-delay: -0.18s; }
    @keyframes tap { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } }

    .steam { opacity: 0; animation: steam 3s linear infinite; }
    .steam.s2 { animation-delay: 1.5s; }
    @keyframes steam {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 0.7; }
      50% { transform: translate(1px, -3px); }
      100% { transform: translate(0, -7px); opacity: 0; }
    }

    .line { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 8s steps(6) infinite; }
    .line.l2 { animation-delay: 1.2s; }
    .line.l3 { animation-delay: 2.4s; }
    .line.l4 { animation-delay: 3.6s; }
    @keyframes type { 0% { transform: scaleX(0); } 8%, 88% { transform: scaleX(1); } 89%, 100% { transform: scaleX(0); } }

    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }

    /* Coffee break: every 14s the character stops typing, looks at the mug,
       lifts it, takes a sip and puts it back where it was. */
    .typing, .resting, .look, .savor, .reach, .raise, .hand, .mug { animation: 14s steps(1) infinite; }
    .typing { animation-name: typing; }
    @keyframes typing { 0% { opacity: 1; } 70% { opacity: 0; } 96% { opacity: 1; } }
    .resting { opacity: 0; animation-name: resting; }
    @keyframes resting { 0% { opacity: 0; } 70% { opacity: 1; } 96% { opacity: 0; } }
    .look { animation-name: look; }
    @keyframes look { 0% { transform: translateX(0); } 71% { transform: translateX(-5px); } 95% { transform: translateX(0); } }
    .savor { transform-box: fill-box; transform-origin: center; animation-name: savor; }
    @keyframes savor { 0% { transform: scaleY(1); } 79% { transform: scaleY(0.2); } 86% { transform: scaleY(1); } }
    .reach { opacity: 0; animation-name: reach; }
    @keyframes reach { 0% { opacity: 0; } 72% { opacity: 1; } 75% { opacity: 0; } 89% { opacity: 1; } 93% { opacity: 0; } }
    .raise { opacity: 0; animation-name: raise; }
    @keyframes raise { 0% { opacity: 0; } 75% { opacity: 1; } 89% { opacity: 0; } }
    .hand { opacity: 0; animation-name: hand; }
    @keyframes hand { 0% { opacity: 0; } 72% { opacity: 1; } 93% { opacity: 0; } }
    .mug { transform-box: view-box; transform-origin: 13.5px 43.5px; animation-name: mug; }
    @keyframes mug {
      0% { transform: translate(0, 0) rotate(0deg); }
      75% { transform: translate(3px, -2px) rotate(0deg); }
      76% { transform: translate(6px, -5px) rotate(0deg); }
      77% { transform: translate(9px, -7px) rotate(0deg); }
      78% { transform: translate(9px, -7px) rotate(15deg); }
      79% { transform: translate(9px, -7px) rotate(30deg); }
      85% { transform: translate(9px, -7px) rotate(15deg); }
      86% { transform: translate(9px, -7px) rotate(0deg); }
      87% { transform: translate(6px, -5px) rotate(0deg); }
      88% { transform: translate(3px, -2px) rotate(0deg); }
      89% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>

  <!-- Room -->
  <clipPath id="frame"><rect width="96" height="64" rx="3"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="96" height="64" fill="#2a3342"/>
    <rect y="46" width="96" height="18" fill="#222a36"/>
  </g>
  <rect x="7" y="8" width="14" height="11" fill="#21262d"/>
  <rect x="8" y="9" width="12" height="9" fill="#1f3a5f"/>
  <rect x="13" y="9" width="1" height="9" fill="#21262d"/>
  <rect x="8" y="13" width="12" height="1" fill="#21262d"/>
  <rect x="10" y="10" width="1" height="1" fill="#e6edf3"/>
  <rect x="17" y="16" width="1" height="1" fill="#e6edf3"/>
  <rect x="16" y="10" width="1" height="1" fill="#8b949e"/>

  <!-- Chair -->
  <rect x="21" y="31" width="3" height="15" fill="#484f58"/>
  <rect x="21" y="31" width="3" height="1" fill="#6e7681"/>

  <!-- Character: one compact block, orange on top and a black hoodie below -->
  <rect x="26" y="33" width="14" height="7" fill="#D97757"/>
  <rect x="26" y="33" width="14" height="1" fill="#E8906F"/>
  <g class="look"><g class="savor">
    <rect class="blink" x="33" y="35" width="1" height="2" fill="#1a1a1a"/>
    <rect class="blink" x="37" y="35" width="1" height="2" fill="#1a1a1a"/>
  </g></g>
  <rect x="26" y="40" width="14" height="6" fill="#0f1114"/>
  <rect x="26" y="40" width="14" height="1" fill="#3a414b"/>
  <rect x="34" y="40" width="3" height="6" fill="#f0f0f0"/>
  <rect x="33" y="41" width="1" height="5" fill="#2b3038"/>
  <rect x="37" y="41" width="1" height="5" fill="#2b3038"/>
  <!-- Side nub, as a hoodie sleeve -->
  <rect x="24" y="41" width="2" height="2" fill="#15181c"/>

  <!-- Arms reaching the keyboard -->
  <g class="typing">
    <g class="tap-b">
      <rect x="40" y="41" width="4" height="2" fill="#0b0d10"/>
      <rect x="44" y="42" width="2" height="2" fill="#C15F3C"/>
    </g>
    <g class="tap-a">
      <rect x="40" y="42" width="3" height="2" fill="#15181c"/>
      <rect x="40" y="42" width="3" height="1" fill="#3a414b"/>
      <rect x="43" y="43" width="2" height="2" fill="#D97757"/>
    </g>
  </g>
  <!-- Front arm resting on the desk during the coffee break -->
  <g class="resting">
    <rect x="40" y="43" width="3" height="2" fill="#15181c"/>
    <rect x="40" y="43" width="3" height="1" fill="#3a414b"/>
    <rect x="43" y="44" width="2" height="2" fill="#D97757"/>
  </g>
  <!-- Side arm: stretched to the mug on the desk, then raised to the face -->
  <rect class="reach" x="18" y="42" width="6" height="2" fill="#15181c"/>
  <rect class="raise" x="24" y="37" width="2" height="5" fill="#15181c"/>

  <!-- Monitor -->
  <rect x="54" y="16" width="34" height="24" fill="#30363d"/>
  <rect x="56" y="18" width="30" height="19" fill="#0d1117"/>
  <rect x="56" y="18" width="30" height="2" fill="#161b22"/>
  <rect x="57" y="18" width="1" height="1" fill="#ff7b72"/>
  <rect x="59" y="18" width="1" height="1" fill="#e3b341"/>
  <rect x="61" y="18" width="1" height="1" fill="#7ee787"/>
  <rect x="69" y="40" width="4" height="4" fill="#30363d"/>
  <rect x="65" y="44" width="12" height="2" fill="#30363d"/>

  <!-- Code being typed -->
  <g class="line"><rect x="58" y="22" width="4" height="2" fill="#ff7b72"/><rect x="63" y="22" width="8" height="2" fill="#79c0ff"/><rect x="72" y="22" width="4" height="2" fill="#e6edf3"/></g>
  <g class="line l2"><rect x="60" y="25" width="6" height="2" fill="#d2a8ff"/><rect x="67" y="25" width="11" height="2" fill="#a5d6ff"/></g>
  <g class="line l3"><rect x="60" y="28" width="4" height="2" fill="#ff7b72"/><rect x="65" y="28" width="9" height="2" fill="#7ee787"/></g>
  <g class="line l4"><rect x="60" y="31" width="8" height="2" fill="#79c0ff"/><rect x="69" y="31" width="6" height="2" fill="#ffa657"/></g>
  <rect class="cursor" x="58" y="34" width="2" height="2" fill="#e6edf3"/>

  <!-- Coffee mug with a Claude orange band -->
  <g class="mug">
    <rect x="11" y="41" width="5" height="5" fill="#e6edf3"/>
    <rect x="12" y="41" width="3" height="1" fill="#6b4423"/>
    <rect x="11" y="43" width="5" height="1" fill="#D97757"/>
    <rect x="16" y="42" width="1" height="3" fill="#e6edf3"/>
    <rect class="steam" x="12" y="38" width="1" height="2" fill="#8b949e"/>
    <rect class="steam s2" x="14" y="38" width="1" height="2" fill="#8b949e"/>
    <!-- Hand holding the handle, it travels with the mug -->
    <rect class="hand" x="16" y="42" width="2" height="2" fill="#D97757"/>
  </g>

  <!-- Desk with keyboard -->
  <rect x="42" y="45" width="12" height="1" fill="#8b949e"/>
  <rect x="4" y="46" width="88" height="2" fill="#8b5a2b"/>
  <rect x="4" y="48" width="88" height="2" fill="#6b4423"/>
  <rect x="8" y="50" width="2" height="11" fill="#6b4423"/>
  <rect x="86" y="50" width="2" height="11" fill="#6b4423"/>

  <!-- Nameplate on the desk front -->
  <rect x="10" y="50" width="76" height="9" fill="#5a3a1e"/>
  <rect x="20" y="50" width="57" height="9" fill="#b8912a"/>
  <rect x="20" y="50" width="57" height="1" fill="#e3c35a"/>
  <rect x="20" y="58" width="57" height="1" fill="#8a6a1c"/>
  <g fill="#3b2a14"><rect x="23" y="52" width="2" height="1"/><rect x="23" y="53" width="1" height="1"/><rect x="25" y="53" width="1" height="1"/><rect x="23" y="54" width="1" height="1"/><rect x="25" y="54" width="1" height="1"/><rect x="23" y="55" width="1" height="1"/><rect x="25" y="55" width="1" height="1"/><rect x="23" y="56" width="2" height="1"/><rect x="27" y="52" width="3" height="1"/><rect x="28" y="53" width="1" height="1"/><rect x="28" y="54" width="1" height="1"/><rect x="28" y="55" width="1" height="1"/><rect x="27" y="56" width="3" height="1"/><rect x="31" y="52" width="3" height="1"/><rect x="31" y="53" width="1" height="1"/><rect x="31" y="54" width="2" height="1"/><rect x="31" y="55" width="1" height="1"/><rect x="31" y="56" width="3" height="1"/><rect x="36" y="52" width="2" height="1"/><rect x="35" y="53" width="1" height="1"/><rect x="35" y="54" width="1" height="1"/><rect x="37" y="54" width="1" height="1"/><rect x="35" y="55" width="1" height="1"/><rect x="37" y="55" width="1" height="1"/><rect x="36" y="56" width="2" height="1"/><rect x="39" y="52" width="3" height="1"/><rect x="39" y="53" width="1" height="1"/><rect x="41" y="53" width="1" height="1"/><rect x="39" y="54" width="1" height="1"/><rect x="41" y="54" width="1" height="1"/><rect x="39" y="55" width="1" height="1"/><rect x="41" y="55" width="1" height="1"/><rect x="39" y="56" width="3" height="1"/><rect x="43" y="54" width="3" height="1"/><rect x="47" y="52" width="2" height="1"/><rect x="47" y="53" width="1" height="1"/><rect x="49" y="53" width="1" height="1"/><rect x="47" y="54" width="2" height="1"/><rect x="47" y="55" width="1" height="1"/><rect x="47" y="56" width="1" height="1"/><rect x="52" y="52" width="1" height="1"/><rect x="51" y="53" width="1" height="1"/><rect x="53" y="53" width="1" height="1"/><rect x="51" y="54" width="3" height="1"/><rect x="51" y="55" width="1" height="1"/><rect x="53" y="55" width="1" height="1"/><rect x="51" y="56" width="1" height="1"/><rect x="53" y="56" width="1" height="1"/><rect x="55" y="52" width="2" height="1"/><rect x="55" y="53" width="1" height="1"/><rect x="57" y="53" width="1" height="1"/><rect x="55" y="54" width="2" height="1"/><rect x="55" y="55" width="1" height="1"/><rect x="57" y="55" width="1" height="1"/><rect x="55" y="56" width="1" height="1"/><rect x="57" y="56" width="1" height="1"/><rect x="59" y="52" width="2" height="1"/><rect x="59" y="53" width="1" height="1"/><rect x="61" y="53" width="1" height="1"/><rect x="59" y="54" width="1" height="1"/><rect x="61" y="54" width="1" height="1"/><rect x="59" y="55" width="1" height="1"/><rect x="61" y="55" width="1" height="1"/><rect x="59" y="56" width="2" height="1"/><rect x="63" y="52" width="3" height="1"/><rect x="63" y="53" width="1" height="1"/><rect x="65" y="53" width="1" height="1"/><rect x="63" y="54" width="1" height="1"/><rect x="65" y="54" width="1" height="1"/><rect x="63" y="55" width="1" height="1"/><rect x="65" y="55" width="1" height="1"/><rect x="63" y="56" width="3" height="1"/><rect x="67" y="52" width="1" height="1"/><rect x="69" y="52" width="1" height="1"/><rect x="67" y="53" width="1" height="1"/><rect x="69" y="53" width="1" height="1"/><rect x="67" y="54" width="3" height="1"/><rect x="69" y="55" width="1" height="1"/><rect x="69" y="56" width="1" height="1"/><rect x="71" y="52" width="3" height="1"/><rect x="71" y="53" width="1" height="1"/><rect x="71" y="54" width="2" height="1"/><rect x="73" y="55" width="1" height="1"/><rect x="71" y="56" width="2" height="1"/></g>
</svg>
