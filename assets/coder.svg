<svg xmlns="http://www.w3.org/2000/svg" width="512" height="320" viewBox="0 0 128 80" shape-rendering="crispEdges">
  <title>Personaje pixel art programando con una taza de café</title>
  <style>
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.15); } }

    .tap-a { animation: tap 0.36s steps(1) infinite; }
    .tap-b { animation: tap 0.36s steps(1) infinite; animation-delay: -0.18s; }
    @keyframes tap { 0% { transform: translateY(0); } 50% { transform: translateY(1px); } }

    .steam { opacity: 0; animation: steam 3s linear infinite; }
    .steam.s2 { animation-delay: 1s; }
    .steam.s3 { animation-delay: 2s; }
    @keyframes steam {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 0.7; }
      50% { transform: translate(1px, -4px); }
      100% { transform: translate(0, -9px); opacity: 0; }
    }

    .line { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 10s steps(8) infinite; }
    .line.l2 { animation-delay: 1.2s; }
    .line.l3 { animation-delay: 2.4s; }
    .line.l4 { animation-delay: 3.6s; }
    .line.l5 { animation-delay: 4.8s; }
    @keyframes type { 0% { transform: scaleX(0); } 8%, 88% { transform: scaleX(1); } 89%, 100% { transform: scaleX(0); } }

    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
  </style>

  <!-- Room -->
  <clipPath id="frame"><rect width="128" height="80" rx="4"/></clipPath>
  <g clip-path="url(#frame)">
    <rect width="128" height="80" fill="#2a3342"/>
    <rect y="58" width="128" height="22" fill="#222a36"/>
  </g>
  <rect x="8" y="10" width="18" height="14" fill="#21262d"/>
  <rect x="9" y="11" width="16" height="12" fill="#1f3a5f"/>
  <rect x="16" y="11" width="1" height="12" fill="#21262d"/>
  <rect x="9" y="16" width="16" height="1" fill="#21262d"/>
  <rect x="11" y="13" width="1" height="1" fill="#e6edf3"/>
  <rect x="21" y="19" width="1" height="1" fill="#e6edf3"/>
  <rect x="19" y="12" width="1" height="1" fill="#8b949e"/>

  <!-- Chair -->
  <rect x="27" y="30" width="5" height="28" fill="#484f58"/>
  <rect x="27" y="30" width="5" height="1" fill="#6e7681"/>

  <!-- Character: head -->
  <rect x="34" y="22" width="20" height="15" fill="#D97757"/>
  <rect x="34" y="22" width="20" height="1" fill="#E8906F"/>
  <rect x="34" y="36" width="20" height="1" fill="#C15F3C"/>
  <rect x="31" y="29" width="3" height="3" fill="#D97757"/>
  <rect x="54" y="29" width="3" height="3" fill="#D97757"/>
  <rect x="31" y="31" width="3" height="1" fill="#C15F3C"/>
  <rect x="54" y="31" width="3" height="1" fill="#C15F3C"/>
  <rect class="blink" x="44" y="27" width="2" height="4" fill="#1a1a1a"/>
  <rect class="blink" x="50" y="27" width="2" height="4" fill="#1a1a1a"/>

  <!-- Character: black hoodie, open in the middle over a white t-shirt -->
  <rect x="32" y="37" width="24" height="3" fill="#1b1f24"/>
  <rect x="32" y="37" width="24" height="1" fill="#3a414b"/>
  <rect x="32" y="40" width="24" height="18" fill="#0f1114"/>
  <rect x="32" y="40" width="1" height="18" fill="#2b3038"/>
  <rect x="42" y="38" width="8" height="20" fill="#f0f0f0"/>
  <rect x="42" y="38" width="8" height="1" fill="#c9d1d9"/>
  <rect x="41" y="38" width="1" height="20" fill="#2b3038"/>
  <rect x="50" y="38" width="1" height="20" fill="#2b3038"/>
  <rect x="41" y="40" width="1" height="5" fill="#e6edf3"/>
  <rect x="50" y="40" width="1" height="5" fill="#e6edf3"/>

  <!-- Character: arms reaching the keyboard -->
  <g class="tap-b">
    <rect x="52" y="43" width="8" height="4" fill="#0b0d10"/>
    <rect x="58" y="46" width="8" height="4" fill="#0b0d10"/>
    <rect x="66" y="50" width="3" height="3" fill="#C15F3C"/>
  </g>
  <g class="tap-a">
    <rect x="49" y="46" width="8" height="4" fill="#15181c"/>
    <rect x="55" y="49" width="7" height="4" fill="#15181c"/>
    <rect x="49" y="46" width="8" height="1" fill="#3a414b"/>
    <rect x="55" y="49" width="7" height="1" fill="#3a414b"/>
    <rect x="62" y="52" width="3" height="3" fill="#D97757"/>
  </g>

  <!-- Monitor -->
  <rect x="72" y="18" width="46" height="32" fill="#30363d"/>
  <rect x="74" y="20" width="42" height="27" fill="#0d1117"/>
  <rect x="92" y="50" width="6" height="5" fill="#30363d"/>
  <rect x="87" y="55" width="16" height="2" fill="#30363d"/>
  <rect x="74" y="20" width="42" height="3" fill="#161b22"/>
  <rect x="76" y="21" width="1" height="1" fill="#ff7b72"/>
  <rect x="78" y="21" width="1" height="1" fill="#e3b341"/>
  <rect x="80" y="21" width="1" height="1" fill="#7ee787"/>

  <!-- Code being typed -->
  <g class="line l1"><rect x="77" y="26" width="6" height="2" fill="#ff7b72"/><rect x="84" y="26" width="10" height="2" fill="#79c0ff"/><rect x="95" y="26" width="6" height="2" fill="#e6edf3"/></g>
  <g class="line l2"><rect x="80" y="30" width="8" height="2" fill="#d2a8ff"/><rect x="89" y="30" width="14" height="2" fill="#a5d6ff"/></g>
  <g class="line l3"><rect x="80" y="34" width="5" height="2" fill="#ff7b72"/><rect x="86" y="34" width="12" height="2" fill="#7ee787"/><rect x="99" y="34" width="4" height="2" fill="#e6edf3"/></g>
  <g class="line l4"><rect x="80" y="38" width="10" height="2" fill="#79c0ff"/><rect x="91" y="38" width="8" height="2" fill="#ffa657"/></g>
  <g class="line l5"><rect x="77" y="42" width="3" height="2" fill="#e6edf3"/></g>
  <rect class="cursor" x="82" y="42" width="2" height="2" fill="#e6edf3"/>

  <!-- Coffee mug with a Claude orange band -->
  <rect x="16" y="50" width="8" height="8" fill="#e6edf3"/>
  <rect x="17" y="50" width="6" height="1" fill="#6b4423"/>
  <rect x="16" y="54" width="8" height="1" fill="#D97757"/>
  <rect x="24" y="52" width="2" height="1" fill="#e6edf3"/>
  <rect x="25" y="52" width="1" height="4" fill="#e6edf3"/>
  <rect x="24" y="55" width="2" height="1" fill="#e6edf3"/>
  <rect class="steam" x="18" y="46" width="1" height="2" fill="#8b949e"/>
  <rect class="steam s2" x="20" y="46" width="1" height="2" fill="#8b949e"/>
  <rect class="steam s3" x="22" y="46" width="1" height="2" fill="#8b949e"/>

  <!-- Desk with keyboard -->
  <rect x="58" y="56" width="18" height="2" fill="#8b949e"/>
  <rect x="59" y="56" width="16" height="1" fill="#b1bac4"/>
  <rect x="8" y="58" width="112" height="3" fill="#8b5a2b"/>
  <rect x="8" y="61" width="112" height="2" fill="#6b4423"/>
  <rect x="12" y="63" width="3" height="13" fill="#6b4423"/>
  <rect x="113" y="63" width="3" height="13" fill="#6b4423"/>
</svg>
